# Catalogue schemas: what the public sees (`catalogue/public.ts`) and what the
# photographer edits in the studio (`routes/studio-catalogue.ts`).

schemas:
  DirectoryPhotographer:
    type: object
    description: |
      One card of the directory (marketplace-spec.md R6.1). An allowlist: no id,
      status, login, bio or settings.
    required: [handle, displayName, coverImageUrl, fromPriceRwf, districts, categories, takingBookings]
    additionalProperties: false
    properties:
      handle: { type: string, examples: [kigali-lens] }
      displayName: { type: string }
      coverImageUrl: { type: [string, 'null'], format: uri, description: 'An `https://` URL the photographer pasted.' }
      fromPriceRwf:
        description: The cheapest **active** package of an **active** service. A photographer with none is not listed.
        allOf:
          - $ref: 'common.yaml#/schemas/Rwf'
      districts:
        type: array
        description: Where they work, in the districts' fixed order (Kigali's first).
        items: { $ref: '#/schemas/PublicDistrict' }
      categories:
        type: array
        description: What they shoot, active categories only, in the platform's order.
        items: { $ref: '#/schemas/PublicCategory' }
      takingBookings: { $ref: '#/schemas/TakingBookings' }

  DirectoryPage:
    type: object
    description: |
      One page of the directory: 24 cards at most, bookable photographers
      first, then by `fromPriceRwf`, then by name (case-insensitive), then a
      stable tiebreak, so pages never overlap or skip.

      `total` is the exact number of matches across all pages, and is answered
      **only without `date`**: under the date filter the availability engine
      decides who stays, and it runs on the candidates up to the requested
      page only, so no honest total exists. `hasMore` is always exact: without
      a date `page * 24 < total`; with one, true only when a survivor beyond
      this page was actually found.
    required: [photographers, page, pageSize, hasMore]
    additionalProperties: false
    properties:
      photographers:
        type: array
        maxItems: 24
        items: { $ref: '#/schemas/DirectoryPhotographer' }
      page: { type: integer, minimum: 1 }
      pageSize: { const: 24 }
      hasMore: { type: boolean }
      total:
        type: integer
        minimum: 0
        description: Every match across all pages. Absent when `date` is given.

  PublicDistrict:
    type: object
    required: [code, name]
    additionalProperties: false
    properties:
      code: { type: string, examples: [gasabo] }
      name: { type: string, examples: [Gasabo] }

  PublicCategory:
    type: object
    required: [slug, name]
    additionalProperties: false
    properties:
      slug: { type: string, examples: [wedding] }
      name: { type: string, examples: [Wedding] }

  ProvinceDistricts:
    type: object
    description: One of Rwanda's five provinces with its districts.
    required: [code, name, districts]
    additionalProperties: false
    properties:
      code: { type: string, enum: [kigali, eastern, northern, southern, western] }
      name:
        type: string
        description: The province's English name, for display. A translated page may label it by `code` instead.
        examples: [Kigali City]
      districts:
        type: array
        items: { $ref: '#/schemas/PublicDistrict' }

  TakingBookings:
    type: boolean
    description: |
      Whether the photographer can be booked right now (marketplace-spec.md
      R5.4, R5.5). False while their subscription is `past_due`: they stay
      listed, the page shows a "not taking bookings" notice, and their packages
      answer the quote, the calendar and the booking form as an inactive package
      does. An `expired` photographer is not listed at all.

  PublicPhotographerDetail:
    type: object
    description: |
      A photographer's profile page (marketplace-spec.md R6.2). An allowlist:
      no id, no status, no login email, no operating settings. `email` is the
      contact address the photographer chose to publish, or null -- never
      their login; each contact field is null when not set.
      `cancellationPolicy` is the one setting on it: the terms a new booking
      would be made under.

      **Every text field is returned verbatim** (`bio` included, markup and
      all) and must be rendered as plain text, never as HTML or markdown
      (R6.5, T6.4). Image URLs are `https://` only; render them with
      `referrerpolicy="no-referrer"`.
    required:
      [handle, displayName, bio, contactPhone, whatsappPhone, email, coverImageUrl, takingBookings, cancellationPolicy, districts, categories, portfolio, services]
    additionalProperties: false
    properties:
      handle: { type: string, examples: [kigali-lens] }
      displayName: { type: string }
      takingBookings: { $ref: '#/schemas/TakingBookings' }
      bio:
        type: [string, 'null']
        maxLength: 2000
        description: Plain text, verbatim. Line breaks are the photographer's own.
      contactPhone: { type: [string, 'null'] }
      whatsappPhone: { type: [string, 'null'] }
      email: { type: [string, 'null'], format: email }
      coverImageUrl: { type: [string, 'null'], format: uri }
      cancellationPolicy: { $ref: '#/schemas/PublicCancellationPolicy' }
      districts:
        type: array
        items: { $ref: '#/schemas/PublicDistrict' }
      categories:
        type: array
        description: Active categories only.
        items: { $ref: '#/schemas/PublicCategory' }
      portfolio:
        type: array
        maxItems: 24
        description: At most 24, in the photographer's order.
        items: { $ref: '#/schemas/PortfolioImage' }
      services:
        type: array
        description: The active services in catalogue order. Each one's packages and add-ons are at `/api/photographers/{handle}/services/{slug}`.
        items: { $ref: '#/schemas/PublicServiceSummary' }

  PortfolioImage:
    type: object
    required: [url, caption]
    additionalProperties: false
    properties:
      url: { type: string, format: uri, pattern: '^https://' }
      caption: { type: [string, 'null'], maxLength: 200 }

  PublicServiceSummary:
    type: object
    required: [slug, nameEn, descriptionEn, coverImageUrl, fromPriceRwf]
    additionalProperties: false
    properties:
      slug: { type: string, examples: [portraits] }
      nameEn: { type: string }
      descriptionEn: { type: [string, 'null'] }
      coverImageUrl: { type: [string, 'null'], format: uri }
      fromPriceRwf:
        type: [integer, 'null']
        minimum: 0
        description: The cheapest active package, whole RWF; null while the service has no active package.

  PublicCancellationPolicy:
    type: object
    description: |
      The client cancellation terms the photographer offers new bookings, as
      set now. A booking snapshots them when it is made, so a booking's own
      pages state the booking's terms (`CancellationTerms`), not these.
    required: [cutoffHours, bookingFeeRefundable]
    additionalProperties: false
    properties:
      cutoffHours:
        type: integer
        minimum: 0
        description: A client may cancel until this many hours before the shoot starts. 0 means any time before it.
      bookingFeeRefundable:
        type: boolean
        description: Whether a client's own cancellation refunds the booking fee. A photographer cancelling always refunds in full.

  PublicPackage:
    type: object
    required: [id, nameEn, descriptionEn, priceRwf, photoCount, durationMinutes]
    additionalProperties: false
    properties:
      id: { $ref: 'common.yaml#/schemas/Uuid' }
      nameEn: { type: string }
      descriptionEn: { type: [string, 'null'] }
      priceRwf: { $ref: 'common.yaml#/schemas/Rwf' }
      photoCount: { type: integer, minimum: 0 }
      durationMinutes: { type: integer, minimum: 1 }

  PublicAddon:
    type: object
    required: [id, nameEn, priceRwf]
    additionalProperties: false
    properties:
      id: { $ref: 'common.yaml#/schemas/Uuid' }
      nameEn: { type: string }
      priceRwf: { $ref: 'common.yaml#/schemas/Rwf' }

  PublicService:
    type: object
    description: |
      An active service with its active packages, and the active add-ons it
      offers: its own first, then those its photographer offers on every
      service, each in display order.
    required: [id, slug, nameEn, descriptionEn, coverImageUrl, packages, addons]
    additionalProperties: false
    properties:
      id: { $ref: 'common.yaml#/schemas/Uuid' }
      slug: { type: string, examples: [portraits] }
      nameEn: { type: string }
      descriptionEn: { type: [string, 'null'] }
      coverImageUrl: { type: [string, 'null'], format: uri }
      packages:
        type: array
        items: { $ref: '#/schemas/PublicPackage' }
      addons:
        type: array
        items: { $ref: '#/schemas/PublicAddon' }

  PublicServiceDetail:
    description: A service plus the booking-fee rate that applies to it, so a page can show a live quote.
    allOf:
      - $ref: '#/schemas/PublicServiceFields'
    type: object
    required: [id, slug, nameEn, descriptionEn, coverImageUrl, packages, addons, bookingFeeRate, takingBookings]
    unevaluatedProperties: false
    properties:
      bookingFeeRate:
        type: number
        minimum: 0
        maximum: 1
        description: The service's own override if set, else its photographer's rate.
      takingBookings:
        description: The photographer's, as on their profile, so the service page knows whether to open the slot picker.
        allOf:
          - $ref: '#/schemas/TakingBookings'

  # PublicService without `additionalProperties: false`, so the detail can extend it.
  PublicServiceFields:
    type: object
    properties:
      id: { $ref: 'common.yaml#/schemas/Uuid' }
      slug: { type: string }
      nameEn: { type: string }
      descriptionEn: { type: [string, 'null'] }
      coverImageUrl: { type: [string, 'null'], format: uri }
      packages:
        type: array
        items: { $ref: '#/schemas/PublicPackage' }
      addons:
        type: array
        items: { $ref: '#/schemas/PublicAddon' }

  QuoteRequest:
    type: object
    required: [packageId]
    description: |
      What to price. Any other key (a `totalRwf`, a `bookingFeeRwf`) is stripped
      unread: the price always comes from the catalogue.
    properties:
      packageId: { $ref: 'common.yaml#/schemas/Uuid' }
      addonIds:
        type: array
        maxItems: 50
        uniqueItems: true
        items: { $ref: 'common.yaml#/schemas/Uuid' }
        default: []

  Quote:
    type: object
    description: |
      The API's price for a basket. Only the booking fee is rounded (half-up, to
      a whole franc); the session fee is the remainder, so the two always add
      up to the total.
    required: [totalRwf, bookingFeeRwf, sessionFeeRwf, service, package, addons, bookingFeeRate]
    additionalProperties: false
    properties:
      totalRwf: { $ref: 'common.yaml#/schemas/Rwf' }
      bookingFeeRwf:
        $ref: 'common.yaml#/schemas/Rwf'
        description: |
          Paid now to hold the slot. Whether a client's own cancellation refunds
          it is the photographer's cancellation policy; by default it does not.
      sessionFeeRwf:
        $ref: 'common.yaml#/schemas/Rwf'
        description: Due after the shoot.
      bookingFeeRate: { type: number, minimum: 0, maximum: 1 }
      service:
        type: object
        required: [id, slug, nameEn]
        additionalProperties: false
        properties:
          id: { $ref: 'common.yaml#/schemas/Uuid' }
          slug: { type: string }
          nameEn: { type: string }
      package:
        type: object
        required: [id, nameEn, priceRwf]
        additionalProperties: false
        properties:
          id: { $ref: 'common.yaml#/schemas/Uuid' }
          nameEn: { type: string }
          priceRwf: { $ref: 'common.yaml#/schemas/Rwf' }
      addons:
        type: array
        description: In the order the service page lists them, whatever order they were selected in.
        items: { $ref: '#/schemas/PublicAddon' }

  # --- Admin ---------------------------------------------------------------

  AdminService:
    allOf:
      - $ref: '#/schemas/AdminServiceFields'
    required: [id, slug, nameEn, nameFr, descriptionEn, descriptionFr, coverImageUrl, bookingFeeRateOverride, isActive, sortOrder]
    unevaluatedProperties: false

  # AdminService without the closing keyword, so the catalogue entry can extend it.
  AdminServiceFields:
    type: object
    properties:
      id: { $ref: 'common.yaml#/schemas/Uuid' }
      slug: { type: string }
      nameEn: { type: string }
      nameFr: { type: [string, 'null'] }
      descriptionEn: { type: [string, 'null'] }
      descriptionFr: { type: [string, 'null'] }
      coverImageUrl: { type: [string, 'null'], format: uri }
      bookingFeeRateOverride:
        type: [number, 'null']
        description: Null means the global booking-fee rate applies.
      isActive: { type: boolean }
      sortOrder: { type: integer }

  AdminPackage:
    type: object
    required: [id, serviceId, nameEn, nameFr, descriptionEn, descriptionFr, priceRwf, photoCount, durationMinutes, isActive, sortOrder]
    additionalProperties: false
    properties:
      id: { $ref: 'common.yaml#/schemas/Uuid' }
      serviceId: { $ref: 'common.yaml#/schemas/Uuid' }
      nameEn: { type: string }
      nameFr: { type: [string, 'null'] }
      descriptionEn: { type: [string, 'null'] }
      descriptionFr: { type: [string, 'null'] }
      priceRwf: { $ref: 'common.yaml#/schemas/Rwf' }
      photoCount: { type: integer, minimum: 0 }
      durationMinutes: { type: integer, minimum: 1 }
      isActive: { type: boolean }
      sortOrder: { type: integer }

  AdminAddon:
    type: object
    required: [id, serviceId, nameEn, nameFr, priceRwf, isActive, sortOrder]
    additionalProperties: false
    properties:
      id: { $ref: 'common.yaml#/schemas/Uuid' }
      serviceId:
        type: [string, 'null']
        format: uuid
        description: Null means offered on every service.
      nameEn: { type: string }
      nameFr: { type: [string, 'null'] }
      priceRwf: { $ref: 'common.yaml#/schemas/Rwf' }
      isActive: { type: boolean }
      sortOrder: { type: integer }

  AdminCatalogue:
    type: object
    required: [services, sharedAddons]
    additionalProperties: false
    properties:
      services:
        type: array
        description: Every service, active or not, with all its packages and its own add-ons.
        items:
          allOf:
            - $ref: '#/schemas/AdminServiceFields'
          type: object
          required: [id, slug, nameEn, nameFr, descriptionEn, descriptionFr, coverImageUrl, bookingFeeRateOverride, isActive, sortOrder, packages, addons]
          unevaluatedProperties: false
          properties:
            packages:
              type: array
              items: { $ref: '#/schemas/AdminPackage' }
            addons:
              type: array
              items: { $ref: '#/schemas/AdminAddon' }
      sharedAddons:
        type: array
        description: Add-ons offered on every service (`serviceId` null).
        items: { $ref: '#/schemas/AdminAddon' }

  PackageSaved:
    type: object
    description: |
      The saved package, and a warning when it is longer than every open day
      (spec §6.8): saving is allowed, but no client will ever see a slot for it.
    required: [package, warning]
    additionalProperties: false
    properties:
      package: { $ref: '#/schemas/AdminPackage' }
      warning:
        oneOf:
          - type: 'null'
          - type: object
            required: [code, longestWindow]
            additionalProperties: false
            properties:
              code: { const: duration_exceeds_longest_window }
              longestWindow:
                description: The longest open window, in minutes after Kigali midnight; null with no open day at all.
                oneOf:
                  - type: 'null'
                  - type: object
                    required: [opensMinute, closesMinute]
                    additionalProperties: false
                    properties:
                      opensMinute: { type: integer }
                      closesMinute: { type: integer }

  ServiceWrite:
    type: object
    description: |
      Create requires `slug` and `nameEn`; an update sends any subset. Blank
      optional text is stored as null. Unknown keys are a 400.
    additionalProperties: false
    properties:
      slug:
        type: string
        maxLength: 100
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        description: Lowercase words joined by single hyphens. Unique; a taken slug is 409 `slug_taken`.
      nameEn: { type: string, minLength: 1, maxLength: 200 }
      nameFr: { type: [string, 'null'], maxLength: 200 }
      descriptionEn: { type: [string, 'null'], maxLength: 5000 }
      descriptionFr: { type: [string, 'null'], maxLength: 5000 }
      coverImageUrl:
        type: [string, 'null']
        format: uri
        description: A pasted link to an image hosted elsewhere. Must be `https:`; `http:` is a 422.
      bookingFeeRateOverride:
        type: [number, 'null']
        minimum: 0
        maximum: 1
        description: At most three decimal places. Null uses the global rate.
      isActive: { type: boolean }
      sortOrder: { type: integer, minimum: 0 }

  PackageWrite:
    type: object
    description: Create requires `serviceId`, `nameEn`, `priceRwf`, `photoCount` and `durationMinutes`; `serviceId` cannot be changed later.
    additionalProperties: false
    properties:
      serviceId:
        $ref: 'common.yaml#/schemas/Uuid'
        description: Create only. A service that does not exist is a 422 naming `serviceId`.
      nameEn: { type: string, minLength: 1, maxLength: 200 }
      nameFr: { type: [string, 'null'], maxLength: 200 }
      descriptionEn: { type: [string, 'null'], maxLength: 5000 }
      descriptionFr: { type: [string, 'null'], maxLength: 5000 }
      priceRwf: { $ref: 'common.yaml#/schemas/Rwf' }
      photoCount: { type: integer, minimum: 0 }
      durationMinutes: { type: integer, minimum: 1 }
      isActive: { type: boolean }
      sortOrder: { type: integer, minimum: 0 }

  AddonWrite:
    type: object
    description: Create requires `serviceId` (null for every service), `nameEn` and `priceRwf`; `serviceId` cannot be changed later.
    additionalProperties: false
    properties:
      serviceId:
        type: [string, 'null']
        format: uuid
        description: Create only.
      nameEn: { type: string, minLength: 1, maxLength: 200 }
      nameFr: { type: [string, 'null'], maxLength: 200 }
      priceRwf: { $ref: 'common.yaml#/schemas/Rwf' }
      isActive: { type: boolean }
      sortOrder: { type: integer, minimum: 0 }
