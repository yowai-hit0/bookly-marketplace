# Shared schemas, responses and parameters. Referenced from the path files as
# `../components/common.yaml#/<group>/<Name>`.

schemas:
  Error:
    type: object
    description: Every error body. `error` is a stable, machine-readable code.
    required: [error]
    properties:
      error:
        type: string
        examples: [not_found]

  ValidationError:
    type: object
    description: |
      A well-formed request breaking a rule (422). `fields` names the offending
      fields so a form can mark them; values are never echoed back.
    required: [error, fields]
    additionalProperties: false
    properties:
      error:
        const: validation_failed
      fields:
        type: array
        items:
          type: string
        examples: [[email, startsAt]]

  Instant:
    type: string
    format: date-time
    description: An ISO-8601 instant, always UTC in responses (`2026-10-14T07:00:00.000Z`).

  OffsetInstant:
    type: string
    format: date-time
    description: |
      An ISO-8601 instant **with an explicit offset** (`2026-10-14T09:00:00+02:00`
      or `…Z`). A bare local time is refused: it would be read in the server's zone.

  KigaliDate:
    type: string
    format: date
    description: A calendar date in Africa/Kigali (UTC+2, no DST), `YYYY-MM-DD`. Years 0000–0099 are refused.

  Rwf:
    type: integer
    minimum: 0
    description: Whole Rwandan francs. Money is never a float.

  Uuid:
    type: string
    format: uuid

  BookingReference:
    type: string
    pattern: '^BKY-\d{4}-[0-9A-HJKMNP-TV-Z]{5}$'
    description: |
      The booking's quotable reference: `BKY-`, the Kigali year and month it
      was **made**, and five Crockford base-32 characters. Not a secret.
    examples: [BKY-2610-7MAR5]

  BookingStatus:
    type: string
    enum: [pending_payment, confirmed, completed, no_show, expired, cancelled_by_client, cancelled_by_photographer, cancelled_by_platform]

  BookingStage:
    type: string
    description: |
      The display stage derived from status and time (`booking/stage.ts`).
      `needs_review` is admin-only: a client never sees it.
    enum: [awaiting_payment, confirmed, in_progress, needs_review, completed, closed, no_show, expired, cancelled_by_client, cancelled_by_photographer, cancelled_by_platform]

  PaymentStatus:
    type: string
    enum: [initiated, pending, succeeded, failed, refund_due, refunded]

  PaymentKind:
    type: string
    description: The kinds a booking's payment can be. A subscription payment (Phase 5) is never one of a booking's.
    enum: [booking_fee, session_fee]

  PlanInterval:
    type: string
    description: The subscription plan's interval (marketplace-spec.md R5.2).
    enum: [monthly, yearly]

  SubscriptionStatus:
    type: string
    description: |
      `trialing` or `active` while the current period runs; `past_due` from its
      end until the grace days are over (listed, not bookable); then `expired`
      (hidden). Computed from the clock, so it is right even when the job that
      records it runs late (R5.4).
    enum: [trialing, active, past_due, expired]

  PaymentMethod:
    type: string
    description: |
      `card` is paid in Flutterwave's v3 Inline modal on our own page (user
      decisions, 2026-10-30), offered only when its keys are configured; a
      method not on offer is a 422 at every pay route.
    enum: [momo_mtn, momo_airtel, card]

  PaymentStarted:
    type: object
    description: |
      The attempt, and for `method: card` the Flutterwave Inline config to open
      (`card`, absent for MoMo).
    required: [payment]
    additionalProperties: false
    properties:
      payment:
        type: object
        required: [ourRef, status]
        additionalProperties: false
        properties:
          ourRef:
            $ref: '#/schemas/Uuid'
          status:
            const: pending
      card:
        $ref: '#/schemas/InlineCardConfig'

  CardPaymentOpen:
    type: object
    description: |
      A card payment of this fee whose checkout session is still open: the SAME
      payment and `tx_ref`, answered again instead of starting a second one. Its
      `session_duration` is what is left of the first session.
    required: [payment, card]
    additionalProperties: false
    properties:
      payment:
        type: object
        required: [ourRef, status]
        additionalProperties: false
        properties:
          ourRef:
            $ref: '#/schemas/Uuid'
          status:
            const: pending
      card:
        $ref: '#/schemas/InlineCardConfig'

  InlineCardConfig:
    type: object
    description: |
      The argument to Flutterwave v3 Inline's `FlutterwaveCheckout({...})`,
      built entirely on the server: pass it as it is, adding only the page's own
      `callback` and `onclose`. Nothing in it may come from the page. The
      redirect after the modal (3-D Secure included) appends `tx_ref`,
      `transaction_id` and `status`; none of it is a result -- poll the status
      route, passing `transactionId` (cards as built, marketplace-spec.md).
    required: [public_key, tx_ref, amount, currency, payment_options, redirect_url, customer, customizations, configurations]
    additionalProperties: false
    properties:
      public_key:
        type: string
        description: The Flutterwave v3 public key (`FLWPUBK…`). Never the secret key.
        examples: ['FLWPUBK_TEST-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx-X']
      tx_ref:
        description: Our `ourRef`. Flutterwave verifies and reports by it.
        $ref: '#/schemas/Uuid'
      amount:
        description: Whole RWF, the payment row's frozen amount.
        $ref: '#/schemas/Rwf'
      currency:
        const: RWF
      payment_options:
        const: card
      redirect_url:
        type: string
        format: uri
        description: |
          A page on WEB_ORIGIN, built on the server: `/checkout/{reference}/{token}/payments/{ourRef}`
          (booking fee), `/payments/{ourRef}` (session fee, guest page; never the
          booking's token), `/account/bookings/{reference}/payments/{ourRef}`
          (session fee, account) or `/studio/subscription/payments/{ourRef}`.
      customer:
        type: object
        required: [email, name]
        additionalProperties: false
        properties:
          email: { type: string }
          name: { type: string }
          phone_number:
            type: string
            description: Absent when there is no phone on record.
      customizations:
        type: object
        required: [title]
        additionalProperties: false
        properties:
          title: { type: string, examples: ['Bookly booking fee BKY-2610-7K3QX'] }
      configurations:
        type: object
        required: [session_duration]
        additionalProperties: false
        properties:
          session_duration:
            type: integer
            minimum: 1
            maximum: 1440
            description: Minutes the modal may stay open; never past the payment's own session (15 minutes from its start) nor, for a booking fee, the hold.

  PaymentInProgress:
    type: object
    description: |
      An earlier attempt is still waiting on the payer. Poll its `ourRef`
      instead. `method` says how it was started: `card` is a checkout the
      page may reopen by paying with `card` again; a MoMo method is a prompt on
      the payer's phone; null where the attempt names no method.
    required: [error, payment]
    properties:
      error:
        const: payment_in_progress
      payment:
        type: object
        required: [ourRef, method]
        properties:
          ourRef:
            $ref: '#/schemas/Uuid'
          method:
            oneOf:
              - type: 'null'
              - $ref: '#/schemas/PaymentMethod'

  PaymentNotStarted:
    type: object
    description: |
      The provider refused the request (`rejected`: an unknown or unusable
      number) or could not be reached in time (`unavailable`). The attempt is
      recorded as `failed`; the payer may try again.
    required: [error, reason, payment]
    properties:
      error:
        const: payment_not_started
      reason:
        type: string
        enum: [rejected, unavailable]
      payment:
        type: object
        required: [ourRef, status]
        properties:
          ourRef:
            $ref: '#/schemas/Uuid'
          status:
            const: failed

  PayRequest:
    type: object
    description: |
      `phone` is required for MoMo (missing: 400) and not read for `card`. Any
      other key (an amount, a status, a provider) is ignored.
    required: [method]
    properties:
      method:
        description: One of the methods on offer (`GET /api/payment-methods`); it decides which provider is prompted. Anything else is a 422.
        allOf:
          - $ref: '#/schemas/PaymentMethod'
      phone:
        type: string
        maxLength: 40
        description: The MoMo number to prompt. Rwandan numbers may be local (`0788…`) or international (`+250788…`); an unusable number is a 422. Not read for `card`.
        examples: ['+250788123456']

responses:
  BadRequest:
    description: |
      Not the shape of a request: invalid JSON, a wrong type, an unknown or
      missing key, a malformed id or date.
    content:
      application/json:
        schema:
          $ref: '#/schemas/Error'
        example:
          error: invalid_request

  ValidationFailed:
    description: Well-formed, but a value breaks a rule. Names the fields.
    content:
      application/json:
        schema:
          $ref: '#/schemas/ValidationError'

  NotFound:
    description: |
      Nothing there. For a capability token this is also the answer for an
      expired, superseded or malformed token: never 403, which would confirm
      that a booking exists. On a studio route it is also the answer for an id
      that belongs to another photographer.
    content:
      application/json:
        schema:
          $ref: '#/schemas/Error'
        example:
          error: not_found

  RateLimited:
    description: |
      Too many requests from this address (or, for bookings, this email) in the
      window. Nothing was done. `Retry-After` gives the seconds to wait.
    headers:
      Retry-After:
        schema:
          type: integer
          minimum: 1
    content:
      application/json:
        schema:
          $ref: '#/schemas/Error'
        example:
          error: rate_limited

  Unauthorized:
    description: |
      No valid token for this area. The `WWW-Authenticate` header says which:
      `Bearer realm="bookly-studio"` (or `bookly-platform`, `bookly-account`) for no token,
      `…, error="invalid_token"` for a refused one: expired, tampered, issued
      for another area, issued before a password change or a revocation, or
      for a login since disabled.
    headers:
      WWW-Authenticate:
        schema:
          type: string
    content:
      application/json:
        schema:
          $ref: '#/schemas/Error'
        example:
          error: unauthenticated

parameters:
  Handle:
    name: handle
    in: path
    required: true
    description: |
      A photographer's handle, as in `/p/{handle}`: lowercase letters, digits
      and hyphens, 3 to 30 characters. Anything else is a 404, as an unknown
      handle is.
    schema: { type: string, examples: [kigali-lens] }

  AccessToken:
    name: token
    in: path
    required: true
    description: |
      The booking's **access token**, from its confirmation email or a resend:
      256 random bits, base64url. It is the client's whole identity, so treat
      the URL as a secret. Unknown, expired (365 days) and superseded tokens
      are all a 404.
    schema:
      type: string
      pattern: '^[A-Za-z0-9_-]{16,256}$'

  CheckoutToken:
    name: token
    in: path
    required: true
    description: |
      The checkout token returned when the booking was created: an HMAC of the
      reference, 43 base64url characters. Good only for paying the booking fee
      while the hold lasts.
    schema:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'

  Reference:
    name: reference
    in: path
    required: true
    schema:
      $ref: '#/schemas/BookingReference'

  OurRef:
    name: ourRef
    in: path
    required: true
    description: Our id for one payment attempt, returned when it was started.
    schema:
      $ref: '#/schemas/Uuid'

  TransactionId:
    name: transactionId
    in: query
    required: false
    description: |
      For a card payment: the `transaction_id` Flutterwave gave the page (the
      modal's callback, or the redirect's query). Only says WHICH transaction to
      verify; the server asks Flutterwave itself, and an id that is not this
      payment's settles nothing. Anything but digits is ignored.
    schema:
      type: string
      examples: ['285959875']

  RowId:
    name: id
    in: path
    required: true
    schema:
      $ref: '#/schemas/Uuid'
