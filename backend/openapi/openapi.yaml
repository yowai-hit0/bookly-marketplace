openapi: 3.1.0
info:
  title: Bookly API
  version: 1.0.0
  summary: Booking, payment, studio and platform API for a marketplace of photographers in Kigali.
  description: |
    The API behind the Bookly marketplace. It serves five kinds of caller:

    - **The public**: anonymous visitors browsing photographers and their
      services, checking availability, booking a slot and paying its booking fee.
    - **A booking's client**: no account needed; every client request carries a
      **capability token** in its path, emailed when the booking is confirmed.
    - **A photographer**, in the studio under `/api/studio/*`: an
      `Authorization: Bearer` JWT from `POST /api/studio/auth/login`. Every
      studio route is scoped to the photographer the token names; an id of
      another photographer's row is a 404, exactly like an id that names nothing.
    - **A platform admin**, in the console under `/api/platform/*`: a bearer
      JWT from `POST /api/platform/auth/login`.
    - **A client with an account**, under `/api/account/*`: a bearer JWT from
      `POST /api/account/auth/login`, email verification or Google sign-in.
      Booking still needs no account.

    Each signed-in area has its own login and its own token audience: a token
    from one area is a `401` in every other, whatever its role claim says.

    Read [the API conventions](/api/conventions) first: error shapes, the
    400-versus-422 rule, time zones and money are the same on every operation.

    This file is written by hand. A backend test (`src/openapi.test.ts`) fails
    when a route exists without an operation here, or the other way round, and
    validates real responses against these schemas.
servers:
  - url: https://api.bookly.example
    description: Production
  - url: http://localhost:4000
    description: Local development
# Studio operations inherit this. Public, client and auth operations set
# `security: []` to opt out; platform operations name `platformBearer`, account
# operations `accountBearer`.
security:
  - studioBearer: []
tags:
  - name: Health
  - name: Catalogue & availability
    description: Anonymous browsing and pricing.
  - name: Bookings
    description: Creating a booking and holding its slot.
  - name: Checkout & payments
    description: Paying the booking fee while the hold lasts, and watching a payment settle.
  - name: Client booking
    description: A client's own booking, addressed by its access token.
  - name: Booking links
    description: '"Email me my links": a fresh link for every current booking on an address.'
  - name: Email confirmations
    description: Confirming a booking's change of contact email from the new address.
  - name: Studio auth
    description: Signup, login, email verification and password reset for a photographer's studio account.
  - name: Studio availability
    description: Working hours and blocked time.
  - name: Studio settings
    description: The photographer's operating values and client cancellation policy.
  - name: Studio calendar
  - name: Studio bookings
    description: The bookings list, one booking, and everything done to it.
  - name: Studio payments
  - name: Studio catalogue
    description: Services, packages and add-ons.
  - name: Studio earnings
    description: What the photographer has earned and been paid, and where payouts go (Phase 4).
  - name: Studio subscription
    description: The photographer's subscription, and paying for it by Mobile Money (Phase 5).
  - name: Studio profile
    description: The photographer's public profile and portfolio, as the studio edits them (Phase 7).
  - name: Studio setup
    description: The setup checklist, and submitting the studio for review (Phase 7).
  - name: Platform auth
    description: Login, email verification and password reset for a platform admin.
  - name: Platform photographers
    description: Listing photographers, and approving, suspending and reactivating them.
  - name: Platform payouts
    description: Payouts due, building a draft, marking it paid with the transfer reference, or cancelling it (Phase 4).
  - name: Platform refunds
    description: Refunds of money paid online, which sits in the platform's account (Phase 4).
  - name: Platform settings
    description: The checkout hold, the free trial and the subscription plan; every photographer's subscription (Phase 5).
  - name: Account auth
    description: Signup, login, email verification, password reset and Google sign-in for a client.
  - name: Account
    description: A client's own account.
  - name: Webhooks
    description: Inbound payment-provider callbacks. Called by providers, never by browsers.
