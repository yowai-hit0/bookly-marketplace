    $ref: paths/webhooks.yaml#/mtnMomo
  /api/webhooks/flutterwave:
    $ref: paths/webhooks.yaml#/flutterwave
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 JWT from `POST /api/admin/auth/login`, valid 8 hours. Sent as
        `Authorization: Bearer <token>`; never a cookie. Changing the admin
        password revokes every token already issued.
