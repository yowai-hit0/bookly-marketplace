  /api/admin/bookings/{id}/complete:
    $ref: paths/admin-bookings.yaml#/complete
  /api/admin/bookings/{id}/no-show:
    $ref: paths/admin-bookings.yaml#/noShow
  /api/admin/bookings/{id}/resend-link:
