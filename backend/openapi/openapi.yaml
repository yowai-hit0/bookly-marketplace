  /api/quote:
    $ref: paths/public.yaml#/quote
  /api/availability:
    $ref: paths/public.yaml#/availability
  /api/bookings:
    $ref: paths/public.yaml#/bookings
  /api/booking-links:
    $ref: paths/public.yaml#/bookingLinks
