openapi: 3.1.0
info:
  title: Bookly API
  version: 1.0.0
  summary: Booking, payment and admin API for a photographer's booking site in Kigali.
  description: |
    The API behind the Bookly booking site. It serves three kinds of caller:

    - **The public**: anonymous visitors browsing photographers and their
      services, checking availability, booking a slot and paying its booking fee.
    - **A booking's client**: no account; every client request carries a
      **capability token** in its path, emailed when the booking is confirmed.
    - **The admin** (the photographer): an `Authorization: Bearer` JWT from
      `POST /api/admin/auth/login`.

    Read [the API conventions](/api/conventions) first: error shapes, the
    400-versus-422 rule, time zones and money are the same on every operation.

    This file is written by hand. A backend test (`src/openapi.test.ts`) fails
    when a route exists without an operation here, or the other way round, and
    validates real responses against these schemas.
servers:
  - url: https://api.bookly.example
    description: Production
  - url: http://localhost:4000
    description: Local development
# Admin operations inherit this; public, client and auth operations set
# `security: []` to opt out.
security:
  - adminBearer: []
tags:
  - name: Health
  - name: Catalogue & availability
    description: Anonymous browsing and pricing.
  - name: Bookings
    description: Creating a booking and holding its slot.
  - name: Checkout & payments
    description: Paying the booking fee while the hold lasts, and watching a payment settle.
  - name: Client booking
    description: A client's own booking, addressed by its access token.
  - name: Booking links
    description: '"Email me my links": a fresh link for every current booking on an address.'
  - name: Email confirmations
    description: Confirming a booking's change of contact email from the new address.
  - name: Admin auth
    description: Login and password reset for the one admin account.
  - name: Admin availability
    description: Working hours and blocked time.
  - name: Admin settings
    description: The five operating values.
  - name: Admin calendar
  - name: Admin bookings
    description: The bookings list, one booking, and everything done to it.
  - name: Admin payments
  - name: Admin catalogue
    description: Services, packages and add-ons.
  - name: Webhooks
    description: Inbound payment-provider callbacks. Called by providers, never by browsers.
