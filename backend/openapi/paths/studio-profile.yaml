# The studio's onboarding pages (marketplace-spec.md Phase 7: R7.2, R7.3, T7.1).
# All require the studio bearer token and are the signed-in photographer's own:
# another photographer's portfolio image is a 404, exactly like an id that names
# nothing. The editor's lists are the public `GET /api/categories` and
# `GET /api/districts`. Not rate-limited: nothing here calls a provider, hashes
# a password, or sends more than one email.

profile:
  get:
    operationId: getStudioProfile
    tags: [Studio profile]
    summary: The photographer's profile
    responses:
      '200':
        description: The profile as the editor shows it.
        content:
          application/json:
            schema: { $ref: ../components/onboarding.yaml#/schemas/StudioProfileEnvelope }
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
  patch:
    operationId: updateStudioProfile
    tags: [Studio profile]
    summary: Edit the profile
    description: |
      Changes what is sent and nothing else, in one transaction: a refusal
      changes nothing. District and category names are checked before the
      handle. `districts` and `categories` replace the whole set.

      A different handle while the studio is pending and submitted for review
      (`submittedAt` set) saves, flags the studio's row in the platform console
      (`handleChangedAt`) and emails every platform admin the old and the new
      handle, in the same transaction. Before submission it does neither; no
      other field alerts anyone.
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/onboarding.yaml#/schemas/StudioProfileUpdate }
    responses:
      '200':
        description: The profile as now saved.
        content:
          application/json:
            schema: { $ref: ../components/onboarding.yaml#/schemas/StudioProfileEnvelope }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '409':
        description: |
          `handle_taken`: the handle is reserved or another photographer's.
          `handle_locked`: a different handle after approval (R7.2).
        content:
          application/json:
            schema:
              type: object
              required: [error]
              additionalProperties: false
              properties:
                error: { type: string, enum: [handle_taken, handle_locked] }
      '422':
        $ref: ../components/common.yaml#/responses/ValidationFailed

portfolio:
  get:
    operationId: listStudioPortfolio
    tags: [Studio profile]
    summary: The portfolio
    responses:
      '200':
        description: Every image, in order, and the limit.
        content:
          application/json:
            schema: { $ref: ../components/onboarding.yaml#/schemas/StudioPortfolio }
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
  post:
    operationId: addStudioPortfolioImage
    tags: [Studio profile]
    summary: Add an image
    description: |
      Appends a pasted `https://` image URL (no uploads), with an optional
      caption of at most 200 characters (null or blank: none). A portfolio
      holds at most 24 images: the 25th is `409 portfolio_full`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [url]
            additionalProperties: false
            properties:
              url: { type: string, description: 'An `https://` URL of at most 2,000 characters: malformed is a `400`, another scheme a `422`.' }
              caption: { type: [string, 'null'] }
    responses:
      '201':
        description: The image, last in the order.
        content:
          application/json:
            schema: { $ref: ../components/onboarding.yaml#/schemas/StudioPortfolioImageEnvelope }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '409':
        description: The portfolio already holds 24 images.
        content:
          application/json:
            schema: { $ref: ../components/onboarding.yaml#/schemas/PortfolioFull }
      '422':
        $ref: ../components/common.yaml#/responses/ValidationFailed

portfolioOrder:
  put:
    operationId: reorderStudioPortfolio
    tags: [Studio profile]
    summary: Reorder the portfolio
    description: |
      `ids` must be exactly the photographer's images, each once, in the new
      order. A missing, extra, repeated or another photographer's id is a
      `422` naming `ids`, and nothing changes; an id that is not a uuid is a `400`.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [ids]
            additionalProperties: false
            properties:
              ids:
                type: array
                maxItems: 24
                items: { $ref: ../components/common.yaml#/schemas/Uuid }
    responses:
      '200':
        description: Every image, in the new order.
        content:
          application/json:
            schema:
              type: object
              required: [images]
              additionalProperties: false
              properties:
                images:
                  type: array
                  items: { $ref: ../components/onboarding.yaml#/schemas/StudioPortfolioImage }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '422':
        $ref: ../components/common.yaml#/responses/ValidationFailed

portfolioItem:
  patch:
    operationId: updateStudioPortfolioImage
    tags: [Studio profile]
    summary: Change an image's caption
    parameters:
      - $ref: ../components/common.yaml#/parameters/RowId
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [caption]
            additionalProperties: false
            properties:
              caption: { type: [string, 'null'], description: At most 200 characters; null or blank clears it. }
    responses:
      '200':
        description: The image.
        content:
          application/json:
            schema: { $ref: ../components/onboarding.yaml#/schemas/StudioPortfolioImageEnvelope }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '422':
        $ref: ../components/common.yaml#/responses/ValidationFailed
  delete:
    operationId: deleteStudioPortfolioImage
    tags: [Studio profile]
    summary: Remove an image
    parameters:
      - $ref: ../components/common.yaml#/parameters/RowId
    responses:
      '204':
        description: Removed.
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/NotFound

setup:
  get:
    operationId: getStudioSetup
    tags: [Studio setup]
    summary: The setup checklist
    description: |
      Every item of R7.3 with whether it is done, the photographer's status,
      when the studio was submitted for review, and whether it can be now.
    responses:
      '200':
        description: The checklist.
        content:
          application/json:
            schema: { $ref: ../components/onboarding.yaml#/schemas/SetupEnvelope }
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized

setupSubmit:
  post:
    operationId: submitStudioSetup
    tags: [Studio setup]
    summary: Submit the studio for review
    description: |
      Records the submission and emails every platform admin
      (`photographer_application_received`, variant `submitted`). Only a
      submitted studio can be approved. Idempotent: a studio already submitted
      answers `200` with its first `submittedAt`, sends nothing and is not
      re-judged. Edits afterwards keep the submission. Takes no body.
    responses:
      '200':
        description: Submitted, now or before.
        content:
          application/json:
            schema: { $ref: ../components/onboarding.yaml#/schemas/SetupEnvelope }
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '409':
        description: The photographer is not pending (approved or suspended).
        content:
          application/json:
            schema:
              type: object
              required: [error]
              additionalProperties: false
              properties:
                error: { const: not_pending }
      '422':
        description: An item is not done (T7.1). Nothing was recorded or sent.
        content:
          application/json:
            schema: { $ref: ../components/onboarding.yaml#/schemas/SetupIncomplete }
