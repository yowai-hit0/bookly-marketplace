paymentMethods:
  get:
    operationId: getPaymentMethods
    tags: [Checkout & payments]
    summary: The payment methods on offer
    description: |
      The methods the pay pages may offer, in display order, and nothing else
      (marketplace-spec.md R3.1). Each method is routed to its own provider:
      MTN MoMo to MTN direct or Flutterwave (`MOMO_MTN_PROVIDER`), Airtel Money
      always to Flutterwave, card to Flutterwave v3 Inline (listed last, only
      with its keys). `PAYMENT_METHODS_ENABLED` may narrow the list, and a
      method whose provider is not configured is never listed, so the list may
      be empty. No provider is named: which one collects a method is not the
      payer's concern.
      `Cache-Control: no-store`. Anonymous.
    security: []
    responses:
      '200':
        description: The methods on offer.
        content:
          application/json:
            schema:
              type: object
              required: [methods]
              additionalProperties: false
              properties:
                methods:
                  type: array
                  uniqueItems: true
                  items: { $ref: ../components/common.yaml#/schemas/PaymentMethod }
                  examples: [[momo_mtn, momo_airtel, card], [momo_mtn, momo_airtel], [card], []]

checkout:
  get:
    operationId: getCheckout
    tags: [Checkout & payments]
    summary: The checkout for a held booking
    description: "What the pay page shows. Addressed by the booking reference and its checkout token; a wrong token is a 404, as an unknown reference is. `Cache-Control: no-store`."
    security: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/Reference
      - $ref: ../components/common.yaml#/parameters/CheckoutToken
    responses:
      '200':
        description: The checkout.
        content:
          application/json:
            schema: { $ref: ../components/booking.yaml#/schemas/Checkout }
      '404':
        $ref: ../components/common.yaml#/responses/NotFound

checkoutPayments:
  post:
    operationId: startCheckoutPayment
    tags: [Checkout & payments]
    summary: Pay the booking fee
    description: |
      Starts a booking-fee payment; the payer's phone is prompted through the
      provider the chosen method routes to (R3.1). The amount is the booking's
      frozen booking fee: an amount, provider or reference in the body is
      ignored. `Cache-Control: no-store`.

      `method: card` needs no phone and calls no provider: the answer carries
      the Flutterwave Inline config (`card`) for the page to open. While that
      card checkout is still open, paying by card again answers `200` with the
      SAME payment and config; another method meets `payment_in_progress` for
      the first three minutes, as any attempt does.
    security: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/Reference
      - $ref: ../components/common.yaml#/parameters/CheckoutToken
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/common.yaml#/schemas/PayRequest }
    responses:
      '201':
        description: The attempt was accepted; poll its `ourRef`. For a card, open `card`.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/PaymentStarted }
      '200':
        description: This fee's card checkout is still open; reopen it.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/CardPaymentOpen }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '409':
        description: |
          Nothing to start: `already_paid`, `hold_expired`, `nothing_to_pay`,
          `photographer_unavailable` (the photographer can no longer be booked,
          R3.4; nothing is charged), or `payment_in_progress` (an attempt still
          waits — its `ourRef` is given).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../components/common.yaml#/schemas/Error
                - $ref: ../components/common.yaml#/schemas/PaymentInProgress
            examples:
              already_paid: { value: { error: already_paid } }
              hold_expired: { value: { error: hold_expired } }
              nothing_to_pay: { value: { error: nothing_to_pay } }
              photographer_unavailable: { value: { error: photographer_unavailable } }
              in_progress: { value: { error: payment_in_progress, payment: { ourRef: 00000000-0000-4000-8000-000000000000, method: momo_mtn } } }
      '422':
        description: A method not on offer (not enabled, or its provider not configured), or an unusable phone number.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/ValidationError }
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited
      '502':
        description: The provider refused the request or could not be reached.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/PaymentNotStarted }

paymentStatus:
  get:
    operationId: getPaymentStatus
    tags: [Checkout & payments]
    summary: Where a payment stands
    description: |
      The confirmation page polls this while a Mobile Money payment settles —
      often 30 seconds or more. Addressed by the random `our_ref` the pay page
      was handed; shows no contact details. `Cache-Control: no-store`. A
      subscription payment's reference is a 404 here: the studio polls it at
      `/api/studio/subscription/payments/{ourRef}`.

      For a card payment still pending, the poll first asks Flutterwave itself
      (at most once per payment every 5 seconds, whoever polls), so the answer
      after the modal can already be the result. Nothing in the query is ever a
      result: `status=successful` is ignored (T3.2).
    security: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/OurRef
      - $ref: ../components/common.yaml#/parameters/TransactionId
    responses:
      '200':
        description: The payment and the booking it is for.
        content:
          application/json:
            schema: { $ref: ../components/booking.yaml#/schemas/PaymentStatusView }
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
