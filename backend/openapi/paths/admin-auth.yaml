login:
  post:
    operationId: adminLogin
    tags: [Admin auth]
    summary: Log in
    description: |
      Email and password for the one admin account. Returns a bearer JWT valid
      8 hours. Unknown email, wrong password and a locked account are one
      answer — `401 invalid_credentials` — so none is disclosed; repeated
      failures lock the account and email the photographer. `Cache-Control: no-store`.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/admin.yaml#/schemas/LoginRequest }
    responses:
      '200':
        description: Signed in.
        content:
          application/json:
            schema: { $ref: ../components/admin.yaml#/schemas/LoginResponse }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        description: Invalid credentials (or the account is locked — not disclosed which).
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            example: { error: invalid_credentials }
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

resetRequest:
  post:
    operationId: requestPasswordReset
    tags: [Admin auth]
    summary: Request a password reset
    description: |
      If the address is the admin's, a single-use, time-limited reset link is
      emailed. The answer is always `202`, whether or not it is, so the endpoint
      does not reveal the admin's address.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email]
            properties:
              email: { type: string, minLength: 1, maxLength: 320 }
    responses:
      '202':
        description: Accepted (sent only if the address is the admin's).
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              additionalProperties: false
              properties:
                ok: { const: true }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

resetConfirm:
  post:
    operationId: confirmPasswordReset
    tags: [Admin auth]
    summary: Set a new password from a reset link
    description: Consumes the emailed token and sets the new password, which revokes every token already issued. The token works once.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [token, newPassword]
            properties:
              token: { type: string, minLength: 1, maxLength: 512 }
              newPassword: { type: string, minLength: 12, maxLength: 1024 }
    responses:
      '204':
        description: The password is changed.
      '400':
        description: A malformed body, or an invalid or expired token.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            examples:
              invalid_request: { value: { error: invalid_request } }
              invalid_token: { value: { error: invalid_or_expired_token } }

me:
  get:
    operationId: getAdminMe
    tags: [Admin auth]
    summary: The signed-in admin
    responses:
      '200':
        description: The admin.
        content:
          application/json:
            schema: { $ref: ../components/admin.yaml#/schemas/AdminEnvelope }
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
