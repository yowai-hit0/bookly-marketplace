# Inbound payment-provider callbacks. Called by the providers, never by a
# browser. Mounted ahead of the JSON parser so the raw bytes can be verified.
# The body is read raw (any content type), capped at 64 kB.
#
# Every delivery is stored before it is interpreted and keyed on the provider's
# own event id, so a repeat is a no-op and an event for an already-settled
# payment is recorded and ignored. A delivery whose signature fails is stored
# unverified, changes nothing, and is a 401 (marketplace-spec.md T3.3). Any
# other delivery on record is 200 — applied, or ignored (a duplicate, an
# unmatched payment, a wrong amount or currency) — so the provider stops
# retrying; a 500 asks for the retry that processes it again. The 200 body
# never says which. Every provider with payments in flight keeps its route,
# whether a method routes to it today or not (R3.1).

mtnMomo:
  post:
    operationId: mtnMomoWebhookPost
    tags: [Webhooks]
    summary: MTN MoMo callback
    description: |
      MTN signs nothing it sends, so the proof is in the URL: the path carries
      our reference and `HMAC(our_ref)` keyed from `SESSION_SECRET`, and the
      body's `externalId` must name the same payment. Only MTN is ever given
      this URL. A body failing either check is stored, applied to nothing,
      and answered 401.
    security: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/OurRef
      - name: signature
        in: path
        required: true
        description: '`HMAC(our_ref)`, base64url.'
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: MTN's requesttopay status body.
            properties:
              externalId: { type: string }
              status: { type: string, examples: [SUCCESSFUL, PENDING, FAILED] }
              amount: { type: string }
              financialTransactionId: { type: string }
    responses:
      '200':
        $ref: '#/_responses/received'
      '401':
        $ref: '#/_responses/invalidSignature'
      '500':
        $ref: '#/_responses/failed'
  put:
    operationId: mtnMomoWebhookPut
    tags: [Webhooks]
    summary: MTN MoMo callback (PUT)
    description: Same as the POST callback; MTN may deliver either verb.
    security: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/OurRef
      - name: signature
        in: path
        required: true
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              externalId: { type: string }
              status: { type: string }
              amount: { type: string }
              financialTransactionId: { type: string }
    responses:
      '200':
        $ref: '#/_responses/received'
      '401':
        $ref: '#/_responses/invalidSignature'
      '500':
        $ref: '#/_responses/failed'

flutterwave:
  post:
    operationId: flutterwaveWebhook
    tags: [Webhooks]
    summary: Flutterwave webhook
    description: |
      Verified by the `flutterwave-signature` header, an HMAC-SHA256 of the raw
      body keyed by the dashboard's secret hash. A body whose signature does not
      match is stored unverified, applied to nothing, and answered 401.
    security: []
    parameters:
      - name: flutterwave-signature
        in: header
        required: true
        description: Base64 HMAC-SHA256 of the raw body.
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: A Flutterwave charge event.
            properties:
              type: { type: string, examples: [charge.completed] }
              data: { type: object }
    responses:
      '200':
        $ref: '#/_responses/received'
      '401':
        $ref: '#/_responses/invalidSignature'
      '500':
        $ref: '#/_responses/failed'

flutterwaveCheckout:
  post:
    operationId: flutterwaveCheckoutWebhook
    tags: [Webhooks]
    summary: Flutterwave v3 webhook (cards)
    description: |
      Card payments through Flutterwave v3 Inline (2026-10-30). Verified by the
      `verif-hash` header, the dashboard's secret hash itself, compared in
      constant time; missing or wrong, the delivery is stored unverified,
      applied to nothing, and answered 401.

      The hash is a static shared secret, not an HMAC of the body, so a
      verified delivery is only a CLAIM: it is stored, never applied, and the
      transaction it names is asked of Flutterwave's API
      (`GET /v3/transactions/{id}/verify`). Only that answer is applied, through
      the same store-first, deduplicated, forward-only path, settling a payment
      only when its status is `successful` and its `tx_ref`, `amount` and
      `currency` (RWF) match exactly. A claimed declined try or pending report
      is not asked about: it would apply nothing (a declined card leaves the
      payment open for the next one in the same modal). The API unreachable is
      a 500, so Flutterwave retries.
    security: []
    parameters:
      - name: verif-hash
        in: header
        required: true
        description: The dashboard's secret hash (`FLUTTERWAVE_V3_WEBHOOK_HASH`).
        schema: { type: string }
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            description: A Flutterwave v3 charge event.
            properties:
              event: { type: string, examples: [charge.completed] }
              data:
                type: object
                properties:
                  id: { type: integer }
                  tx_ref: { type: string }
                  amount: { type: number }
                  currency: { type: string }
                  status: { type: string, examples: [successful, failed, pending] }
    responses:
      '200':
        $ref: '#/_responses/received'
      '401':
        $ref: '#/_responses/invalidSignature'
      '500':
        $ref: '#/_responses/failed'

_responses:
  received:
    description: The delivery is on record, applied or ignored.
    content:
      application/json:
        schema:
          type: object
          required: [received]
          additionalProperties: false
          properties:
            received: { const: true }
  invalidSignature:
    description: The signature did not verify. The delivery is stored unverified and changed nothing (T3.3).
    content:
      application/json:
        schema: { $ref: ../components/common.yaml#/schemas/Error }
        example: { error: invalid_signature }
  failed:
    description: Processing failed; the provider should retry.
    content:
      application/json:
        schema: { $ref: ../components/common.yaml#/schemas/Error }
        example: { error: internal_error }
