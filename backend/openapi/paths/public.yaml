health:
  get:
    operationId: getHealth
    tags: [Health]
    summary: Liveness check
    security: []
    responses:
      '200':
        description: The API is up.
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              additionalProperties: false
              properties:
                ok: { const: true }

photographers:
  get:
    operationId: listPhotographers
    tags: [Catalogue & availability]
    summary: The directory
    description: |
      The public directory (marketplace-spec.md R6.1), 24 a page. Listed are
      approved photographers whose subscription is `trialing`, `active` or
      `past_due` (inside the grace), with at least one active package on an
      active service. Pending, suspended and `expired` photographers never
      appear. A `past_due` photographer is listed with `takingBookings: false`,
      after every bookable one, and is left out whenever `date` is given.

      **Date.** Kept are the photographers with at least one bookable start
      that Kigali day for their shortest active package, exactly as
      `GET /api/availability` would offer it: working hours (a dated override
      wins), blocks, bookings and live holds, buffer and lead time. Accepted
      from today (Kigali) to 365 days ahead.

      Every parameter is optional and may appear once. An unknown parameter is
      a 400. `Cache-Control: no-store`. Anonymous.
    security: []
    parameters:
      - name: category
        in: query
        description: An active category's slug (`GET /api/categories`).
        schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 64, examples: [wedding] }
      - name: district
        in: query
        description: A district code (`GET /api/districts`).
        schema: { type: string, pattern: '^[a-z]+(-[a-z]+)*$', maxLength: 32, examples: [gasabo] }
      - name: min
        in: query
        description: Lowest `fromPriceRwf`, inclusive, whole RWF.
        schema: { type: integer, minimum: 0, maximum: 2147483647 }
      - name: max
        in: query
        description: Highest `fromPriceRwf`, inclusive, whole RWF. Must not be below `min`.
        schema: { type: integer, minimum: 0, maximum: 2147483647 }
      - name: date
        in: query
        description: A Kigali date, `YYYY-MM-DD`, from today to 365 days ahead.
        schema: { $ref: ../components/common.yaml#/schemas/KigaliDate }
      - name: page
        in: query
        description: 1-based; defaults to 1. A page past the end is an empty 200.
        schema: { type: integer, minimum: 1, maximum: 1000, default: 1 }
    responses:
      '200':
        description: One page of the directory.
        content:
          application/json:
            schema: { $ref: ../components/catalogue.yaml#/schemas/DirectoryPage }
      '400':
        description: |
          Not the shape of a request: an unknown or repeated parameter, an
          empty value, a slug or code of the wrong form, a number that is not
          whole digits, a malformed date.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            example: { error: invalid_request }
      '422':
        description: |
          Well-formed, but breaks a rule; `fields` names each: `category` (no
          active category has that slug), `district` (no such district),
          `min`/`max` (negative, past the int4 range, or `min > max`, which names
          both), `date` (before today in Kigali, more than 365 days ahead, or a
          year the engine cannot compute), `page` (below 1 or above 1000).
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/ValidationError }

categories:
  get:
    operationId: listCategories
    tags: [Catalogue & availability]
    summary: The active categories
    description: For the directory's filter bar (R6.1). Active categories only, in the platform's order. Anonymous.
    security: []
    responses:
      '200':
        description: The active categories.
        content:
          application/json:
            schema:
              type: object
              required: [categories]
              additionalProperties: false
              properties:
                categories:
                  type: array
                  items: { $ref: ../components/catalogue.yaml#/schemas/PublicCategory }

districts:
  get:
    operationId: listDistricts
    tags: [Catalogue & availability]
    summary: "Rwanda's 30 districts, by province"
    description: For the directory's filter bar (R6.1). The five provinces in a fixed order (Kigali City first), each with its districts. Anonymous.
    security: []
    responses:
      '200':
        description: The districts, grouped by province.
        content:
          application/json:
            schema:
              type: object
              required: [provinces]
              additionalProperties: false
              properties:
                provinces:
                  type: array
                  items: { $ref: ../components/catalogue.yaml#/schemas/ProvinceDistricts }

sitemap:
  get:
    operationId: getSitemap
    tags: [Catalogue & availability]
    summary: The web app's sitemap
    description: |
      An XML sitemap (sitemaps.org 0.9) of the web app's crawlable pages
      (marketplace-spec.md R6.6): `{WEB_ORIGIN}/`, `{WEB_ORIGIN}/photographers`
      and `{WEB_ORIGIN}/p/{handle}` for every **bookable** photographer, each
      profile with `lastmod` from its last update. Past-due, pending,
      suspended and expired photographers are not listed. At most 50,000
      URLs. Served at the API's root, not under `/api`: the web host rewrites
      its own `/sitemap.xml` here. `Cache-Control: public, max-age=3600`.
      Anonymous.
    security: []
    responses:
      '200':
        description: The sitemap.
        content:
          application/xml:
            schema: { type: string }
            example: |
              <?xml version="1.0" encoding="UTF-8"?>
              <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
                <url><loc>https://bookly.example/</loc></url>
                <url><loc>https://bookly.example/photographers</loc></url>
                <url><loc>https://bookly.example/p/kigali-lens</loc><lastmod>2026-10-20T08:00:00.000Z</lastmod></url>
              </urlset>

photographer:
  get:
    operationId: getPhotographer
    tags: [Catalogue & availability]
    summary: One photographer's profile page
    description: |
      The profile page behind `/p/{handle}` (marketplace-spec.md R6.2): the
      profile, districts, categories, up to 24 portfolio images, the active
      services each with its "from" price, the cancellation policy and the
      contact details. Never the photographer's login email, status or
      operating settings: `email` is the public contact address they chose, or
      null. Text is verbatim: render it as plain text (R6.5). An unknown handle
      and the handle of a photographer who is not listed -- pending, suspended,
      or with an `expired` subscription -- are the same 404; the profile page
      words it as "unavailable" (R5.5). A `past_due` photographer's profile is
      served with `takingBookings: false`. Anonymous.
    security: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/Handle
    responses:
      '200':
        description: The public profile.
        content:
          application/json:
            schema:
              type: object
              required: [photographer]
              additionalProperties: false
              properties:
                photographer: { $ref: ../components/catalogue.yaml#/schemas/PublicPhotographerDetail }
      '404':
        $ref: ../components/common.yaml#/responses/NotFound

services:
  get:
    operationId: listPhotographerServices
    tags: [Catalogue & availability]
    summary: List one photographer's active services
    description: |
      The photographer's active services, each with its active packages and the
      add-ons it offers: its own, then those the photographer offers on every
      service. Never another photographer's. A 404 for a handle that is unknown
      or not listed (a `past_due` photographer's services are shown). Anonymous.
    security: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/Handle
    responses:
      '200':
        description: The photographer's public catalogue.
        content:
          application/json:
            schema:
              type: object
              required: [services]
              additionalProperties: false
              properties:
                services:
                  type: array
                  items: { $ref: ../components/catalogue.yaml#/schemas/PublicService }
      '404':
        $ref: ../components/common.yaml#/responses/NotFound

service:
  get:
    operationId: getPhotographerService
    tags: [Catalogue & availability]
    summary: One of a photographer's services by slug
    description: |
      Slugs are unique per photographer, so the same slug under another handle is
      another service. A 404 for an unknown or inactive slug, a slug only another
      photographer has, and a handle that is unknown or not listed. Carries the
      photographer's `takingBookings`. Anonymous.
    security: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/Handle
      - name: slug
        in: path
        required: true
        schema: { type: string }
    responses:
      '200':
        description: The service, plus the booking-fee rate that applies to it.
        content:
          application/json:
            schema:
              type: object
              required: [service]
              additionalProperties: false
              properties:
                service: { $ref: ../components/catalogue.yaml#/schemas/PublicServiceDetail }
      '404':
        $ref: ../components/common.yaml#/responses/NotFound

quote:
  post:
    operationId: createQuote
    tags: [Catalogue & availability]
    summary: Price a basket
    description: The API's authority over money. The price is always computed from the catalogue, never from the body.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/catalogue.yaml#/schemas/QuoteRequest }
    responses:
      '200':
        description: The quote.
        content:
          application/json:
            schema:
              type: object
              required: [quote]
              additionalProperties: false
              properties:
                quote: { $ref: ../components/catalogue.yaml#/schemas/Quote }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '422':
        description: |
          A package or add-on the public cannot book; names the field. A package
          whose photographer cannot be booked is refused as `packageId`, and an
          add-on of another photographer -- even one they offer on every service
          -- as `addonIds`.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/ValidationError }

availability:
  get:
    operationId: getAvailability
    tags: [Catalogue & availability]
    summary: Bookable starts for a package in a month
    description: "Every Kigali date of the month with the slot starts a visitor may book for this package right now. `Cache-Control: no-store`. Anonymous."
    security: []
    parameters:
      - name: packageId
        in: query
        required: true
        schema: { $ref: ../components/common.yaml#/schemas/Uuid }
      - name: month
        in: query
        required: true
        description: '`YYYY-MM`.'
        schema:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
    responses:
      '200':
        description: The month's availability.
        content:
          application/json:
            schema: { $ref: ../components/booking.yaml#/schemas/AvailabilityDays }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '422':
        description: |
          An unbookable package -- its photographer's included, answered exactly
          as an unknown package -- or a month the engine cannot compute. The
          month is the package's photographer's calendar alone.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/ValidationError }

bookings:
  post:
    operationId: createBooking
    tags: [Bookings]
    summary: Create a booking and hold its slot
    description: |
      Turns a chosen slot and a filled form into a `pending_payment` booking
      holding its slot for the hold window. Anonymous. The returned
      `checkoutToken` opens the booking's checkout.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/booking.yaml#/schemas/BookingRequest }
    responses:
      '201':
        description: The booking is held.
        content:
          application/json:
            schema: { $ref: ../components/booking.yaml#/schemas/BookingCreated }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '409':
        description: The slot was claimed between the availability check and the insert.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            example: { error: slot_taken }
      '422':
        description: |
          Something named cannot be booked, or the start is not currently offered
          in the package's photographer's calendar. A package whose photographer
          cannot be booked is `packageId`; another photographer's add-on is
          `addonIds`.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/ValidationError }
      '429':
        description: |
          `too_many_holds`: the email already holds three unpaid slots, or
          `rate_limited` (with `Retry-After`): too many requests from this IP or
          email in the window.
        headers:
          Retry-After:
            schema: { type: integer, minimum: 1 }
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            examples:
              too_many_holds: { value: { error: too_many_holds } }
              rate_limited: { value: { error: rate_limited } }

bookingLinks:
  post:
    operationId: emailBookingLinks
    tags: [Booking links]
    summary: Email a client their booking links
    description: |
      Sends one email with a fresh link for every current booking on the
      address. The response is always `202` — a match, no match, or too many
      requests are indistinguishable, so the endpoint cannot be used to learn
      who has booked. Rate-limited per address and per IP.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/booking.yaml#/schemas/EmailRequest }
    responses:
      '202':
        description: Accepted. Whatever was found happens by email, to the address on the bookings.
        content:
          application/json:
            schema:
              type: object
              required: [sent]
              additionalProperties: false
              properties:
                sent: { const: true }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '422':
        description: Not an email address.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/ValidationError }

emailConfirmation:
  post:
    operationId: confirmEmailChange
    tags: [Email confirmations]
    summary: Confirm a change of contact email
    description: |
      Follows the link sent to the **new** address when a client asked to change
      their booking's email. A POST, not a GET, so a mail scanner opening the
      link cannot trigger the change. Unknown, expired, replaced and already-used
      tokens are all a 404.
    security: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/AccessToken
    responses:
      '200':
        description: The booking now writes to the new address.
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              additionalProperties: false
              properties:
                confirmed: { const: true }
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
