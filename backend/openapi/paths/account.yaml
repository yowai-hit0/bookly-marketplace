# A client's own account (Phase 2 decisions 1, 5 and 6). Every operation but
# the auth ones requires a client's bearer token (`accountBearer`); a
# photographer's or a platform admin's token is a 401, whatever it says.

login:
  post:
    operationId: accountLogin
    tags: [Account auth]
    summary: Log in
    description: |
      Email and password for a client. Returns a bearer JWT for the
      `bookly-account` audience, valid 7 days, which no other area accepts.
      Unknown email, wrong password, a locked account, an unverified address,
      a Google-only account and an account of another kind are one answer:
      `401 invalid_credentials`. `Cache-Control: no-store`.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/auth.yaml#/schemas/LoginRequest }
    responses:
      '200':
        description: Signed in.
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/LoginResponse }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/auth.yaml#/responses/InvalidCredentials
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

resetRequest:
  post:
    operationId: requestAccountPasswordReset
    tags: [Account auth]
    summary: Request a password reset
    description: |
      If the address is a client's login, a single-use reset link to
      `/account/reset-password`, valid 30 minutes, is emailed. Always `202`.
      A Google-only client may use it to add a password.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/auth.yaml#/schemas/ResetRequest }
    responses:
      '202':
        description: Accepted (sent only if the address is a client's login).
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/ResetAccepted }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

resetConfirm:
  post:
    operationId: confirmAccountPasswordReset
    tags: [Account auth]
    summary: Set a new password from a reset link
    description: |
      Consumes the emailed token and sets the new password, which revokes
      every token already issued. The token works once, and only here. A
      completed reset also verifies the address (the link proved the inbox)
      and links the bookings made under it.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/auth.yaml#/schemas/ResetConfirm }
    responses:
      '204':
        description: The password is changed.
      '400':
        $ref: ../components/auth.yaml#/responses/ResetConfirmRefused
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

signup:
  post:
    operationId: accountSignup
    tags: [Account auth]
    summary: Sign up as a client
    description: |
      Creates a client account and emails a verification link to
      `/account/verify/<token>` (valid 24 hours). Bookings made under the
      address are linked to the account only once it is verified, never at
      signup: otherwise anyone could sign up with someone else's address and
      see their bookings.

      The answer is `202` whether or not the address already has an account.
      A taken address gets, by email only, a fresh verification link if it is
      an unverified client login (its password is NOT changed), or a "you
      already have an account" notice if its account is verified.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/auth.yaml#/schemas/ClientSignupRequest }
    responses:
      '202':
        description: Accepted.
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/SignupAccepted }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '422':
        $ref: ../components/common.yaml#/responses/ValidationFailed
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

verify:
  post:
    operationId: verifyAccountEmail
    tags: [Account auth]
    summary: Confirm an email address
    description: |
      Posted by the page the verification link opens (`/account/verify/<token>`;
      opening the link changes nothing). Requires the token AND the password
      the account was created with: the token proves the inbox, the password
      proves the person at it is the one who signed up, so a stranger who
      signed up with someone else's address cannot have it verified for them.
      Either being wrong is one answer, `400 invalid_verification`, and a wrong
      password counts toward the account's lockout.

      On success the address is verified, the link is spent, the bookings made
      under the address are linked to the account, and the caller is signed
      in: the response is a login's. Someone who never chose the password the
      page asks for should use "Forgot password" instead: a completed reset
      verifies the address and replaces the password. `Cache-Control: no-store`.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/auth.yaml#/schemas/VerifyRequest }
    responses:
      '200':
        description: Verified and signed in.
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/LoginResponse }
      '400':
        $ref: ../components/auth.yaml#/responses/VerifyRefused
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

verifyResend:
  post:
    operationId: resendAccountVerification
    tags: [Account auth]
    summary: Send the verification link again
    description: |
      If the address is a client's login whose address is still unverified, a
      new link (valid 24 hours) replaces the old one and is emailed. Always
      `202`, whether or not it is, so the endpoint does not reveal which
      addresses have accounts or which are verified.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/auth.yaml#/schemas/ResendRequest }
    responses:
      '202':
        description: Accepted (sent only for an unverified login of this area).
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/ResetAccepted }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

providers:
  get:
    operationId: getAccountAuthProviders
    tags: [Account auth]
    summary: Sign-in methods on offer
    description: Whether the login page shows "Continue with Google" (configured with `GOOGLE_CLIENT_ID` and `GOOGLE_CLIENT_SECRET`).
    security: []
    responses:
      '200':
        description: The methods.
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/AuthProviders }

googleStart:
  post:
    operationId: startGoogleSignIn
    tags: [Account auth]
    summary: Start signing in with Google
    description: |
      Begins the OpenID Connect authorization code flow with PKCE (S256),
      `state` and `nonce`. Returns Google's authorization URL, whose
      `redirect_uri` is `<WEB_ORIGIN>/account/google/callback`, and the
      state, which the page keeps in `sessionStorage` to compare on return.
      The flow works once, for 10 minutes. No body. `404 not_found` when Google
      sign-in is not configured. `Cache-Control: no-store`.
    security: []
    responses:
      '200':
        description: Send the browser to `authorizationUrl`.
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/GoogleStart }
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

googleCallback:
  post:
    operationId: completeGoogleSignIn
    tags: [Account auth]
    summary: Finish signing in with Google
    description: |
      Posted by `/account/google/callback` with the `code` and `state` Google
      returned, once the page has checked the state against the one it kept.
      The server consumes the flow, exchanges the code with its PKCE verifier,
      verifies the id_token against Google's keys (signature, `iss`, `aud`,
      `exp`, `nonce`) and requires a Google-verified address. Then it signs in
      the client linked to this Google account; or links the client account
      with this address (verifying it, and, if it was never verified,
      discarding its password, which nobody proved was the owner's); or
      creates a new client account with no password. The bookings made under
      the address are linked. The response is a login's.

      - `400 invalid_state`: unknown, expired or already used state. Start again.
      - `400 google_sign_in_failed`: Google refused the code, the identity did
        not verify, or the account cannot sign in.
      - `400 google_email_unverified`: Google has not verified the address.
      - `409 account_conflict`: the address belongs to another kind of
        account, or to a client linked to another Google account. Word it
        generically.
      - `404 not_found`: Google sign-in is not configured.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/auth.yaml#/schemas/GoogleCallbackRequest }
    responses:
      '200':
        description: Signed in.
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/LoginResponse }
      '400':
        description: A malformed body, a bad state, or a refused identity.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            examples:
              invalid_request: { value: { error: invalid_request } }
              invalid_state: { value: { error: invalid_state } }
              google_sign_in_failed: { value: { error: google_sign_in_failed } }
              google_email_unverified: { value: { error: google_email_unverified } }
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '409':
        description: The address belongs to an account that cannot sign in with Google.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            example: { error: account_conflict }
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

me:
  get:
    operationId: getAccountMe
    tags: [Account]
    summary: The signed-in client
    description: |
      The account as the dashboard needs it (Phase 8): the name and phone,
      which credentials it holds (`hasPassword`, `hasGoogle`; never what they
      are), and an address change still waiting on its link (`pendingEmail`).
      `Cache-Control: no-store`.
    security:
      - accountBearer: []
    responses:
      '200':
        description: The client's account.
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/AccountMe }
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized

# --- The client dashboard (marketplace-spec.md Phase 8) ------------------------
# Every operation below but `emailConfirm` is the signed-in client's own. A
# booking reference or a payment's `ourRef` that is not the account's answers
# exactly like one that names nothing: 404 not_found (T8.1).
# `Cache-Control: no-store` throughout.

bookings:
  get:
    operationId: listAccountBookings
    tags: [Account]
    summary: My bookings, across photographers
    description: |
      Every booking made under an address the account has proven (R8.1, R8.4),
      whichever photographer it is with: a guest booking made later with the
      account's verified address appears here by itself.

      `upcoming`: `confirmed` with the shoot not yet over (in progress
      included), and a `pending_payment` hold while it is live, with
      `checkoutPath` to finish paying it. Soonest first. `past`: `completed`,
      `no_show`, every cancellation, and `confirmed` whose shoot is over.
      Latest first. An expired hold is in neither list (it never became a
      booking); its reference still opens its page. Pages of 20.
    security:
      - accountBearer: []
    parameters:
      - $ref: ../components/account.yaml#/parameters/BookingScope
      - $ref: ../components/account.yaml#/parameters/Page
    responses:
      '200':
        description: One page.
        content:
          application/json:
            schema: { $ref: ../components/account.yaml#/schemas/AccountBookingsPage }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '422':
        description: A page below 1 or above 1,000,000.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/ValidationError }

booking:
  get:
    operationId: getAccountBooking
    tags: [Account]
    summary: One of my bookings
    description: The guest booking page's view, authorised by the session instead of the access token, with the photographer's contact details.
    security:
      - accountBearer: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/Reference
    responses:
      '200':
        description: The booking page.
        content:
          application/json:
            schema: { $ref: ../components/account.yaml#/schemas/AccountBookingDetail }
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/NotFound

bookingCancel:
  post:
    operationId: cancelAccountBooking
    tags: [Account]
    summary: Cancel one of my bookings
    description: |
      The guest page's cancellation (R1.8, T8.2): a `confirmed` booking before
      the cut-off its photographer set when it was made. The booking fee is
      refunded only where that policy says so; a session fee already paid is
      always owed back. Both emails go as from the guest page.
    security:
      - accountBearer: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/Reference
    responses:
      '200':
        description: Cancelled; the booking page as it now stands.
        content:
          application/json:
            schema: { $ref: ../components/account.yaml#/schemas/AccountBookingDetail }
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '409':
        description: Already cancelled, past the cut-off, or never confirmed. Nothing changed.
        content:
          application/json:
            schema: { $ref: ../components/account.yaml#/schemas/AccountBookingConflict }

bookingPayments:
  post:
    operationId: payAccountBookingSessionFee
    tags: [Account]
    summary: Pay the session fee of one of my bookings
    description: |
      The guest page's session-fee payment, with the same safety: the amount
      is computed on the server, one attempt at a time, and the provider is the
      one the method routes to (R3.1). Only mounted when payments are
      configured. Shares the guest payment's rate limit. `method: card` answers
      the Flutterwave Inline config, returning to
      `/account/bookings/{reference}/payments/{ourRef}`; again while it is open,
      `200` with the same one.
    security:
      - accountBearer: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/Reference
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/common.yaml#/schemas/PayRequest }
    responses:
      '201':
        description: The phone is being prompted (for a card, open `card`). Poll `GET /api/payments/{ourRef}`.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/PaymentStarted }
      '200':
        description: This fee's card checkout is still open; reopen it.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/CardPaymentOpen }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '409':
        description: Nothing owed (`nothing_to_pay`, with the booking page), or an attempt already waiting (`payment_in_progress`).
        content:
          application/json:
            schema:
              oneOf:
                - $ref: ../components/account.yaml#/schemas/AccountBookingConflict
                - $ref: ../components/common.yaml#/schemas/PaymentInProgress
      '422':
        description: A method not on offer, or an unusable phone number.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/ValidationError }
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited
      '502':
        description: The provider refused the request or could not be reached.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/PaymentNotStarted }

payments:
  get:
    operationId: listAccountPayments
    tags: [Account]
    summary: My payments
    description: |
      Every payment on my bookings that moved money or tried to (R8.2):
      pending, succeeded, failed, owed back or refunded, newest first, with its
      refund and any overpayment. Not an `initiated` row: a request the
      photographer made that nobody has paid yet (the booking page asks for it),
      or a provider call in its first seconds. Pages of 20.
    security:
      - accountBearer: []
    parameters:
      - $ref: ../components/account.yaml#/parameters/Page
    responses:
      '200':
        description: One page.
        content:
          application/json:
            schema: { $ref: ../components/account.yaml#/schemas/AccountPaymentsPage }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '422':
        description: A page below 1 or above 1,000,000.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/ValidationError }

payment:
  get:
    operationId: getAccountReceipt
    tags: [Account]
    summary: The receipt of one of my payments
    description: |
      What the printable receipt page shows (R8.2). Only a payment that took
      money has one: `succeeded`, `refund_due`, `refunded`. Another of my
      payments is `409 no_receipt`; a payment that is not mine, or a malformed
      `ourRef`, is `404`.
    security:
      - accountBearer: []
    parameters:
      - $ref: ../components/common.yaml#/parameters/OurRef
    responses:
      '200':
        description: The receipt.
        content:
          application/json:
            schema: { $ref: ../components/account.yaml#/schemas/ReceiptEnvelope }
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
      '409':
        description: My payment, which took no money (yet).
        content:
          application/json:
            schema: { $ref: ../components/account.yaml#/schemas/NoReceipt }

profile:
  get:
    operationId: getAccountProfile
    tags: [Account]
    summary: My name and phone
    security:
      - accountBearer: []
    responses:
      '200':
        description: The profile.
        content:
          application/json:
            schema: { $ref: ../components/account.yaml#/schemas/AccountProfileEnvelope }
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
  patch:
    operationId: updateAccountProfile
    tags: [Account]
    summary: Edit my name and phone
    description: Bookings already made keep their own contact details (decision 1).
    security:
      - accountBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/account.yaml#/schemas/AccountProfileUpdate }
    responses:
      '200':
        description: Saved.
        content:
          application/json:
            schema: { $ref: ../components/account.yaml#/schemas/AccountProfileEnvelope }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '422':
        $ref: ../components/common.yaml#/responses/ValidationFailed

password:
  post:
    operationId: changeAccountPassword
    tags: [Account]
    summary: Change my password
    description: |
      For an account with a password. The current one is checked with the
      login's lockout. On success every other session is signed out (the
      token fingerprint covers the password), a pending reset link dies, an
      `account_security_alert` (`password_changed`) is emailed, and the answer
      is a login's, with a fresh token for this session.

      - `409 no_password`: a Google-only account; use `/password/set`.
      - `409 credentials_changed`: the credentials changed between the check and the save; nothing was saved.
    security:
      - accountBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/account.yaml#/schemas/PasswordChangeRequest }
    responses:
      '200':
        description: Changed; a fresh token.
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/LoginResponse }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/account.yaml#/responses/WrongPassword
      '409':
        description: No password to change, or the credentials changed meanwhile.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            examples:
              no_password: { value: { error: no_password } }
              credentials_changed: { value: { error: credentials_changed } }
      '422':
        $ref: ../components/common.yaml#/responses/ValidationFailed
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

passwordSet:
  post:
    operationId: setAccountPassword
    tags: [Account]
    summary: Add a password to my Google account
    description: |
      For a Google-only account (decision 2); afterwards it signs in either
      way. There is no old password to check: the session is the proof, and
      an `account_security_alert` (`password_changed`, `added`) tells the
      inbox. Every other session is signed out; the answer is a login's, with
      a fresh token for this one. `409 password_exists` for an account that
      has a password (change it instead).
    security:
      - accountBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/account.yaml#/schemas/PasswordSetRequest }
    responses:
      '200':
        description: Added; a fresh token.
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/LoginResponse }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '409':
        description: The account already has a password.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            example: { error: password_exists }
      '422':
        $ref: ../components/common.yaml#/responses/ValidationFailed
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

email:
  post:
    operationId: requestAccountEmailChange
    tags: [Account]
    summary: Change my email address
    description: |
      Confirmed with the password. Stores the new address as pending (`/me`
      shows it) and emails it a link to `/account/email-confirm/{token}`,
      valid 24 hours; a new request replaces the old one. Nothing changes until
      the link's page posts it with the password (`POST /api/account/email/confirm`).

      The answer is `202` whether or not the new address already has an
      account; if it has one, no link is sent and the change cannot complete.

      - `409 password_required`: a Google-only account cannot change its
        address (decision 2); add a password first.
      - `422 validation_failed` `['newEmail']`: it is already the account's address.
    security:
      - accountBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/account.yaml#/schemas/EmailChangeRequest }
    responses:
      '202':
        description: Asked.
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/ResetAccepted }
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        $ref: ../components/account.yaml#/responses/WrongPassword
      '409':
        description: A Google-only account.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            example: { error: password_required }
      '422':
        $ref: ../components/common.yaml#/responses/ValidationFailed
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

emailConfirm:
  post:
    operationId: confirmAccountEmailChange
    tags: [Account auth]
    summary: Confirm a change of my email address
    description: |
      Posted by the page the link opens (opening it changes nothing). Needs no
      session -- the link opens in a new tab -- but the token AND the
      account's password: the token proves the new inbox, the password the
      person. Either wrong, or the link lapsed, replaced or used, is one
      answer, `400 invalid_confirmation`; a wrong password counts toward the
      lockout.

      On success the account's address is the new one, verified now; bookings
      already linked stay linked, and the unclaimed bookings made under the
      new address are linked too (decision 3). The old address is told, with
      the new one masked. Google sign-in keeps working. The answer is a
      login's. `409 email_taken`: another account took the address since the
      request; the pending change is withdrawn.
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/account.yaml#/schemas/EmailChangeConfirm }
    responses:
      '200':
        description: Changed and signed in.
        content:
          application/json:
            schema: { $ref: ../components/auth.yaml#/schemas/LoginResponse }
      '400':
        description: A malformed body (`invalid_request`), or a refused confirmation.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            examples:
              invalid_request: { value: { error: invalid_request } }
              invalid_confirmation: { value: { error: invalid_confirmation } }
      '409':
        description: The address now belongs to another account.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            example: { error: email_taken }
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

export:
  get:
    operationId: exportAccount
    tags: [Account]
    summary: Export my data
    description: |
      Everything the account holds as one JSON document, sent as an
      attachment (`Content-Disposition: attachment; filename="bookly-account-YYYY-MM-DD.json"`):
      the account, its contact records, its bookings and their payments
      (R8.3, T8.4). Rate-limited.
    security:
      - accountBearer: []
    responses:
      '200':
        description: The export.
        headers:
          Content-Disposition:
            schema: { type: string }
        content:
          application/json:
            schema: { $ref: ../components/account.yaml#/schemas/AccountExport }
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited

delete:
  post:
    operationId: deleteAccount
    tags: [Account]
    summary: Delete my account
    description: |
      Confirmed with the password, or, for a Google-only account, by typing
      its address. The account is anonymised: its address becomes a dead one,
      its name, phone and both credentials are erased, and every token stops
      working. The bookings stay for the photographers' records (Rwanda law
      058/2021), linked to no account; upcoming ones carry on through the
      links already emailed to them (decision 4). A later Google sign-in makes
      a new account, and so does a later signup with the address, which links
      the unclaimed bookings once verified, like any signup.

      The account's own mail (verification, reset and security emails) is
      erased from the outbox, and one `account_security_alert`
      (`account_deleted`) is sent to the erased address; that row erases the
      address itself once it has been delivered or given up on. Booking
      emails are left as they are.

      - `403 invalid_password` / `password_locked`: an account with a password.
      - `403 invalid_confirmation`: a Google-only account whose typed address was missing or not its own.
    security:
      - accountBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/account.yaml#/schemas/DeleteAccountRequest }
    responses:
      '204':
        description: Deleted. Discard the token.
      '400':
        $ref: ../components/common.yaml#/responses/BadRequest
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '403':
        description: The confirmation was wrong.
        content:
          application/json:
            schema: { $ref: ../components/common.yaml#/schemas/Error }
            examples:
              invalid_password: { value: { error: invalid_password } }
              password_locked: { value: { error: password_locked } }
              invalid_confirmation: { value: { error: invalid_confirmation } }
      '429':
        $ref: ../components/common.yaml#/responses/RateLimited
